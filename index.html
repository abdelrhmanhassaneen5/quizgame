<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحدّي الأصحاب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Lemonada:wght@600;700&display=swap">
<style>
:root{--paper:#FBE7B5;--card:#FFE8B5;--ink:#4A2F22;--teal:#2F5F5A;--brown:#6B4A3A;--gold:#C9973F;--red:#7A3B3B;--ok:#2F6B4A;--bad:#8B2E2E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%}
body{background:#2B1B12;font-family:'Cairo',sans-serif;color:var(--ink)}
#app{max-width:430px;min-height:100%;margin:0 auto;box-sizing:border-box;background:var(--paper) repeating-linear-gradient(0deg,transparent 0 31px,rgba(150,110,50,.13) 31px 32px);padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.hd{background:var(--teal);border:2px solid var(--gold);border-radius:16px;color:#FFE9B8;text-align:center;padding:14px}
.hd h1{font-family:'Lemonada',sans-serif;font-size:24px;margin:0}
.hd div{font-size:13px;margin-top:6px}
.card{background:var(--card);border:2px solid #8A6A4A;border-radius:14px;padding:12px}
.tag{background:var(--brown);color:#FFE9B8;border-radius:8px;padding:5px;text-align:center;font-weight:700;font-size:14px}
.tag.g{background:var(--teal)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.sm{font-size:12px;color:var(--teal);font-weight:700}
.btn{background:var(--red);color:#FFE9B8;border:3px solid #D9A84E;border-radius:14px;box-shadow:0 5px 0 #4B2222;font-family:'Lemonada',sans-serif;font-size:18px;padding:12px;min-height:48px;cursor:pointer}
.btn.t{background:var(--teal);box-shadow:0 5px 0 #1B3B38}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4B2222}
.sw{width:52px;height:30px;border-radius:15px;border:2px solid var(--gold);background:#9A8566;position:relative;cursor:pointer;padding:0}
.sw i{position:absolute;top:2px;right:3px;width:22px;height:22px;border-radius:50%;background:#FFE9B8}
.sw.on{background:var(--ok)}
.sw:not(.on) i{right:25px}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--gold);border-radius:20px;padding:4px 12px;font-weight:900}
.bar{flex:1;height:14px;border-radius:7px;background:#E3C98F;border:2px solid #8A6A4A;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--gold)}
.bar.m i{background:#B23A3A}
.tm{background:var(--brown);color:#FFE9B8;border-radius:8px;min-width:38px;text-align:center;font-weight:900;padding:4px}
.en{direction:ltr;text-align:left;font-size:22px;font-weight:700;line-height:1.4;margin:8px 0}
.ar{border-top:2px dashed #8A6A4A;padding-top:8px;font-size:16px;font-weight:700}
.opt{background:var(--card);border:2px solid #8A6A4A;border-radius:14px;box-shadow:0 3px 0 #8A6A4A;min-height:48px;font-family:'Cairo',sans-serif;font-size:19px;font-weight:700;color:var(--ink);direction:ltr;cursor:pointer;padding:8px 14px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--gold)}
.opt.bad{background:var(--bad);color:#fff}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{background:var(--card);border:2px solid #8A6A4A;border-radius:12px;box-shadow:0 3px 0 #8A6A4A;padding:6px 2px;min-height:76px;font-family:'Cairo',sans-serif;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.lv b{font-size:22px}
.lv span{font-size:11px;font-weight:700}
.lv.boss{background:var(--red);color:#FFE9B8;border-color:var(--gold)}
.lv:disabled{opacity:.5;cursor:default}
.big{font-size:38px;font-weight:900;text-align:center}
.inp{font-family:'Cairo',sans-serif;font-size:20px;font-weight:700;padding:10px;border:2px solid #8A6A4A;border-radius:12px;background:#FFF6DD;color:var(--ink);text-align:center;width:100%;box-sizing:border-box}
.me{background:var(--teal);color:#FFE9B8;border-radius:8px;padding:4px 8px}
#mon.hit{animation:hit .5s}
#mon.atk{animation:atk .5s}
@keyframes hit{0%{transform:none;filter:brightness(1)}25%{transform:translateX(-12px) rotate(-8deg);filter:brightness(2)}50%{transform:translateX(12px) rotate(8deg)}100%{transform:none;filter:brightness(1)}}
@keyframes atk{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.gold{background:#E3B03F;border-radius:8px;padding:4px 8px}
.pwb{flex:1;background:var(--card);border:2px solid #8A6A4A;border-radius:12px;font-family:'Cairo',sans-serif;font-weight:700;font-size:13px;color:var(--ink);padding:6px 4px;min-height:44px;cursor:pointer;text-align:center}
.pwb:disabled{opacity:.45;cursor:default}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2F6B4A;margin-inline-end:5px;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.3}}
</style>
<script>
/* بعد ما تفعّل Firebase: امسح null والصق الإعدادات هنا، شكلها:
   window.FIREBASE_CONFIG = {apiKey:"...",authDomain:"...",projectId:"...",appId:"..."}; */
window.FIREBASE_CONFIG = null;
</script>
<script src="questions.js"></script>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import * as FS from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
if(window.FIREBASE_CONFIG){
  const db=FS.getFirestore(initializeApp(window.FIREBASE_CONFIG));
  const vs=FS.collection(db,'visitors');
  const cnt=(q)=>FS.getCountFromServer(q).then((x)=>x.data().count);
  window.FB={
    submit:(wk,uid,name,pts)=>FS.setDoc(FS.doc(db,'weeks',String(wk),'scores',uid),{name:name,pts:pts,t:FS.serverTimestamp()}),
    top:async(wk,n)=>{const s=await FS.getDocs(FS.query(FS.collection(db,'weeks',String(wk),'scores'),FS.orderBy('pts','desc'),FS.limit(n||10)));return s.docs.map(d=>Object.assign({id:d.id},d.data()))},
    log:(d)=>FS.addDoc(FS.collection(db,'logs'),Object.assign({},d,{t:FS.serverTimestamp()})),
    saveGet:async(c)=>{const x=await FS.getDoc(FS.doc(db,'saves',c));return x.exists()?x.data():null},
    saveSet:(c,d)=>FS.setDoc(FS.doc(db,'saves',c),Object.assign({},d,{t:FS.serverTimestamp()})),
    groupsGet:async(wk)=>{
      const q=(w)=>FS.getDocs(FS.query(FS.collection(db,'gscores'),FS.where('w','==',w)));
      const r=await Promise.all([FS.getDocs(FS.collection(db,'groups')),q(wk),q(wk-1)]);
      return {groups:r[0].docs.map((d)=>Object.assign({id:d.id},d.data())),cur:r[1].docs.map((d)=>d.data()),prev:r[2].docs.map((d)=>d.data())};
    },
    ping:(uid,first)=>{const d={last:FS.serverTimestamp(),v:FS.increment(1)};if(first)d.first=FS.serverTimestamp();return FS.setDoc(FS.doc(db,'visitors',uid),d,{merge:true})},
    beat:(uid)=>FS.setDoc(FS.doc(db,'visitors',uid),{last:FS.serverTimestamp()},{merge:true}),
    board:async(wk,lo,hi,mine,n)=>{
      const col=FS.collection(db,'weeks',String(wk),'scores');
      const W=(...c)=>FS.query(col,FS.where('pts','>=',lo),FS.where('pts','<',hi),...c);
      const ds=(s)=>s.docs.map((d)=>Object.assign({id:d.id},d.data()));
      const r=await Promise.all([FS.getDocs(W(FS.orderBy('pts','desc'),FS.limit(n))).then(ds),cnt(W()),cnt(W(FS.where('pts','>',mine)))]);
      let above=[],below=[];
      if(r[2]>=n){const x=await Promise.all([FS.getDocs(W(FS.where('pts','>',mine),FS.orderBy('pts','asc'),FS.limit(3))).then(ds),FS.getDocs(W(FS.where('pts','<',mine),FS.orderBy('pts','desc'),FS.limit(3))).then(ds)]);above=x[0];below=x[1]}
      return {rows:r[0],total:r[1],rank:r[2]+1,above:above,below:below};
    },
    grades:async(base,n)=>{
      if(!(FS.getAggregateFromServer&&FS.sum&&FS.count))return null;
      const p=[];for(let g=1;g<=n;g++){p.push(FS.getAggregateFromServer(FS.collection(db,'weeks',base+'g'+g,'scores'),{n:FS.count(),s:FS.sum('pts')}).then((a)=>({g:g,n:a.data().n,s:a.data().s})).catch(()=>({g:g,n:0,s:0})))}
      return Promise.all(p);
    },
    roomGet:async(c)=>{const x=await FS.getDoc(FS.doc(db,'rooms',c));return x.exists()?x.data():null},
    roomCreate:(c,d)=>FS.setDoc(FS.doc(db,'rooms',c),d),
    roomJoin:async(c,uid,name,stage)=>{
      const r=FS.doc(db,'rooms',c),x=await FS.getDoc(r);
      if(!x.exists())return {err:'مفيش روم بالكود ده'};
      const d=x.data();
      if(d.u1===uid)return {err:'دي الروم بتاعتك، ابعت الكود لصاحبك'};
      if(d.u2)return {err:'الروم دي اتملت'};
      if(d.stage!==stage)return {err:'الروم دي لمرحلة تانية'};
      const end=Date.now()+864e5;
      await FS.updateDoc(r,{u2:uid,n2:name,end:end});
      return {d:Object.assign({},d,{u2:uid,n2:name,end:end})};
    },
    roomPts:(c,side,p)=>FS.updateDoc(FS.doc(db,'rooms',c),side===1?{p1:p}:{p2:p}),
    roomMsg:(c,side,i)=>FS.updateDoc(FS.doc(db,'rooms',c),side===1?{m1:i}:{m2:i}),
    rank:async(wk,mine)=>{
      const col=FS.collection(db,'weeks',String(wk),'scores');
      const r=await Promise.all([cnt(FS.query(col,FS.where('pts','>',mine))),cnt(col)]);
      return {rank:r[0]+1,total:r[1]};
    },
    stats:async(startMs)=>{
      const T=FS.Timestamp.fromMillis;
      const r=await Promise.all([cnt(vs),cnt(FS.query(vs,FS.where('last','>=',T(Date.now()-120000)))),cnt(FS.query(vs,FS.where('last','>=',T(startMs)))),
        FS.getAggregateFromServer&&FS.sum?FS.getAggregateFromServer(vs,{v:FS.sum('v')}).then((x)=>x.data().v).catch(()=>null):Promise.resolve(null)]);
      return {total:r[0],online:Math.max(1,r[1]),today:Math.max(1,r[2]),visits:r[3]};
    }
  };
  if(window.onFB)window.onFB();
}
</script>
<script>
var TT={v:"اختار الكلمة الصح",g:"اكمل الجملة",w:"أي جملة غلط؟"};
var tr=true,G=null,S={},DB=0,app=document.getElementById('app');
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(a){return a.map(function(x){return[Math.random(),x]}).sort(function(a,b){return a[0]-b[0]}).map(function(x){return x[1]})}
function load(){try{S=JSON.parse(localStorage.getItem('qd_v2'))||{}}catch(e){S={}}S.coins=S.coins||0;S.max=S.max||1;S.stars=S.stars||{};S.streak=S.streak||0;S.last=S.last||'';S.seen=S.seen||[];S.inv=S.inv||{fifty:0,time:0,sc:0};S.own=S.own||{ch:['blob'],col:['c0'],th:['t0']};S.eq=S.eq||{ch:'blob',col:'c0',th:'t0'};S.uid=S.uid||(Math.random().toString(36).slice(2)+Date.now().toString(36))}
function save(){try{localStorage.setItem('qd_v2',JSON.stringify(S))}catch(e){}}
function daily(){var t=new Date().toDateString();if(S.last===t)return 0;var y=new Date(Date.now()-864e5).toDateString();S.streak=(S.last===y)?S.streak+1:1;S.last=t;var b=10+5*Math.min(S.streak,5);S.coins+=b;save();return b}
var DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function cairo(){var p={};try{new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'}).formatToParts(new Date()).forEach(function(x){p[x.type]=+x.value})}catch(e){}
  if(!p.year){var t=new Date(Date.now()+3*36e5);p={year:t.getUTCFullYear(),month:t.getUTCMonth()+1,day:t.getUTCDate(),hour:t.getUTCHours(),minute:t.getUTCMinutes(),second:t.getUTCSeconds()}}return p}
function cDay(){var p=cairo();return Math.floor(Date.UTC(p.year,p.month-1,p.day)/864e5)}
function wkKey(){return Math.floor((cDay()-2)/7)}
function dTxt(dn){var t=new Date(dn*864e5);return DN[t.getUTCDay()]+' '+t.getUTCDate()+'/'+(t.getUTCMonth()+1)}
function wkRange(k){return'من '+dTxt(7*k+2)+' إلى '+dTxt(7*k+8)}
function wkPts(){return(S.wk&&S.wk.k===wkKey())?S.wk.p:0}
function addPts(n){var k=wkKey();if(!S.wk||S.wk.k!==k)S.wk={k:k,p:0};S.wk.p+=n;save()}
var GP=['الأول الابتدائي','الثاني الابتدائي','الثالث الابتدائي','الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'],GM=['الأول الإعدادي','الثاني الإعدادي','الثالث الإعدادي'];
function gName(g){g=g||S.grade;return(S.stage==='p'?GP:GM)[g-1]||''}
function gId(k,g){return wkId(k)+'g'+(g||S.grade)}
function logDelta(){
  if(!window.FB||!FB.log||!S.uid||!S.nick)return;
  var k=wkId(wkKey()),pt=wkPts(),now=Date.now();
  if(!S.ls||S.ls.w!==k){S.ls={w:k,p:pt,t:now};save();return}
  var d=pt-S.ls.p;if(d===0)return;
  var sec=Math.min(7200,Math.round((now-S.ls.t)/1000)),r=Math.min(1000,S.nr||0);
  S.ls.p=pt;S.ls.t=now;S.nr=0;save();
  while(d!==0){var c=Math.max(-5000,Math.min(5000,d));d-=c;try{FB.log({u:S.uid,n:S.nick,w:k,g:c,sec:sec,r:r}).catch(function(){})}catch(e){}sec=0;r=0}
}
function submitP(){
  if(!window.FB||!S.nick)return Promise.resolve();logDelta();
  var w=wkKey(),pt=wkPts(),a=[];
  try{a.push(FB.submit(wkId(w),S.uid,S.nick,pt));if(S.grade)a.push(FB.submit(gId(w),S.uid,S.nick,pt))}catch(e){}
  return Promise.all(a.map(function(x){return x.catch(function(){})}));
}
function submit(){submitP();cloudSave()}
function heart(o){return'<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.5-8 11-8 11z" fill="'+(o?'#B23A3A':'#CDB88A')+'" stroke="#6B4A3A" stroke-width="1.5"/></svg>'}
function star(o,s){s=s||16;return'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.5 5.7 21l1.5-7L2 9.3l7-.8z" fill="'+(o?'#C9973F':'#E3C98F')+'" stroke="#6B4A3A" stroke-width="1.2"/></svg>'}
function coin(){return'<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#E3B03F" stroke="#8A6A4A" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="#8A6A4A" stroke-width="1.5"/></svg>'}
function stars(n,s){var r='';for(var i=1;i<=3;i++)r+=star(i<=n,s);return r}
function monster(lv){var b=lv%5===0;return'<svg viewBox="0 0 120 110" width="'+(b?110:94)+'" aria-hidden="true">'+(b?'<path d="M28 34L34 8L50 30zM92 34L86 8L70 30z" fill="#6B4A3A" stroke="#4A2F22" stroke-width="2"/>':'')+'<path d="M15 98C5 58 30 24 60 24S115 58 105 98Z" fill="#7B9E6B" stroke="#4A2F22" stroke-width="3"/><circle cx="45" cy="60" r="11" fill="#fff" stroke="#4A2F22" stroke-width="2"/><circle cx="75" cy="60" r="11" fill="#fff" stroke="#4A2F22" stroke-width="2"/><circle cx="47" cy="62" r="5" fill="#4A2F22"/><circle cx="73" cy="62" r="5" fill="#4A2F22"/><path d="M40 82Q60 98 80 82" fill="none" stroke="#4A2F22" stroke-width="3"/></svg>'}
function home(){setTimeout(function(){fillStats();fillMk();fillGroups();refreshStats();refreshGroups()},0);
  app.innerHTML='<div class="hd"><h1>تحدّي الأصحاب</h1><div>اهزم الوحش بالإنجليزي!</div></div>'+
  '<div class="row"><div class="chip">'+coin()+'<span>'+S.coins+'</span></div><div class="sp"></div><div class="sm">وصلت للجولة '+S.max+'</div></div><div class="card row"><div class="sp"><span class="sm">المرحلة: '+(S.stage==='p'?'ابتدائي':'إعدادي')+' • '+gName()+'</span></div><button class="btn t" style="font-size:13px;padding:4px 12px;min-height:34px" onclick="stageScr()">غيّر</button></div>'+'<div class="card" id="st" style="display:none"></div><div class="card" id="mk" style="display:none"></div><div class="card" id="gp" style="display:none"></div>'+(S.rcOk&&!S.rcSeen?'<div class="card" style="background:#E3B03F;text-align:center;font-weight:900;line-height:1.8">تقدمك اتحفظ على النت!<br>احتفظ بكودك علشان ترجّعه لو غيّرت الموبايل<br><button class="btn t" style="font-size:14px;margin-top:6px" onclick="saveScr()">شوف كودك</button></div>':'')+
  (DB?'<div class="card" style="text-align:center;font-weight:900">مكافأة اليوم: +'+DB+' عملة (أيام ورا بعض: '+S.streak+')</div>':'')+
  '<div class="card row"><div class="sp"><div style="font-weight:900">الترجمة بالعربي</div><div class="sm">تظهر تحت كل سؤال</div></div><button class="sw'+(tr?' on':'')+'" aria-label="الترجمة" onclick="tr=!tr;home()"><i></i></button></div>'+'<div class="card row"><div class="sp"><div style="font-weight:900">الأصوات</div><div class="sm">تصفيق وصوت الوحش وأصوات المرح</div></div><button class="sw'+(S.mute?'':' on')+'" aria-label="الأصوات" onclick="toggleSnd()"><i></i></button></div>'+
  '<div class="card"><div class="tag">إزاي تلعب</div><div style="font-size:14px;margin-top:8px;line-height:1.7">جاوب صح علشان تضرب الوحش. الإجابة الغلط أو خلاص الوقت بيخسّرك قلب. 3 إجابات صح ورا بعض = ضربة قوية!</div></div>'+
  '<div class="sp"></div><button class="btn" style="font-size:20px" onclick="map()">ابدأ اللعب</button><button class="btn t" onclick="board()">ترتيب الأسبوع</button><button class="btn t" onclick="roomScr()">تحدّي صاحب (روم)'+(S.rm?' • شغالة':'')+'</button><button class="btn t" style="display:flex;justify-content:center;align-items:center;gap:10px" onclick="store()">'+shopIcon(30)+'<span>المتجر</span></button><button class="btn t" style="font-size:15px" onclick="saveScr()">حفظ التقدم (كود الاسترجاع)</button>';
}
function map(){
  var g='';for(var i=1;i<=20;i++){var u=i<=S.max,b=i%5===0;
    g+='<button class="lv'+(b?' boss':'')+'" '+(u?'onclick="start('+i+')"':'disabled')+'><b>'+i+'</b><span>'+(b?'زعيم':'جولة')+'</span><div>'+(u?stars(S.stars[i]||0,12):'<span>مقفولة</span>')+'</div></button>'}
  app.innerHTML='<div class="hd"><h1>خريطة الجولات</h1><div>اهزم وحش كل جولة علشان تفتح اللي بعدها</div></div>'+
  '<div class="row"><div class="chip">'+coin()+'<span>'+S.coins+'</span></div></div><div class="grid">'+g+'</div><div class="sp"></div><button class="btn t" onclick="home()">الرئيسية</button>';
}
function pickQs(n){
  var all=Q.map(function(_,i){return i}).filter(function(i){return Q[i][6]===(S.stage||'m')}),out=shuffle(all.filter(function(i){return S.seen.indexOf(i)<0})).slice(0,n);
  if(out.length<n){S.seen=[];out=out.concat(shuffle(all.filter(function(i){return out.indexOf(i)<0})).slice(0,n-out.length))}
  S.seen=S.seen.concat(out);save();return out.map(function(i){return Q[i]});
}
function start(lv){var b=lv%5===0,t=Math.floor((lv-1)/5),n=b?[7,8,9,10][t]:(lv>10?6:5),base=Math.max(7,13-Math.ceil(lv/2)),T=b?Math.max(6,base-2):base,mx=Math.ceil(n*[.6,.7,.8,.85][t]);
  G={lv:lv,tier:t,n:n,T:T,qs:pickQs(n),i:0,h:3,mx:mx,mhp:mx,earned:0,combo:0,ok:0,bad:[],left:T,done:false};show()}
function hearts(){var r='';for(var i=1;i<=3;i++)r+=heart(i<=G.h);return r}
function show(){

function rcWA(){window.open('https://wa.me/?text='+encodeURIComponent('كود استرجاع تقدمي في تحدّي الأصحاب: '+fmtRC(S.rc)),'_blank')}
function saveScr(){
  S.rcSeen=1;save();
  var back=S.stage?'home()':'stageScr()',hd='<div class="hd"><h1>حفظ التقدم</h1><div>ارجّع تقدمك لو غيّرت الموبايل</div></div>';
  if(!window.FB){app.innerHTML=hd+'<div class="card">الميزة دي لسه متفعّلتش.</div><div class="sp"></div><button class="btn t" onclick="'+back+'">رجوع</button>';return}
  var mine=S.rc&&S.rcOk?'<div class="card" style="text-align:center"><div class="sm">كود الاسترجاع بتاعك</div><div class="big" style="font-size:30px;letter-spacing:3px;direction:ltr">'+fmtRC(S.rc)+'</div><div class="sm">آخر حفظ: '+(S.rcAt?new Date(S.rcAt).toLocaleString('ar-EG',{hour:'numeric',minute:'2-digit',day:'numeric',month:'numeric'}):'-')+'</div><div style="font-size:13px;line-height:1.7;margin-top:6px">اكتبه أو صوّره، ومتبعتوش لحد. أي حد معاه الكود يقدر يدخل بتقدمك.</div><div class="row" style="margin-top:8px"><button class="btn t sp" onclick="rcCopy()">نسخ الكود</button><button class="btn t sp" onclick="rcWA()">ابعته لنفسك</button></div><button class="btn" style="width:100%;margin-top:8px;font-size:15px" onclick="cloudSave(true).then(saveScr)">احفظ دلوقتي</button></div>':'<div class="card" style="text-align:center"><div style="font-size:14px;line-height:1.7">لسه محفوظش تقدمك على النت.</div><button class="btn" style="margin-top:8px" onclick="cloudSave(true).then(saveScr)">احفظ تقدمي واعمل كود</button></div>';
  app.innerHTML=hd+mine+'<div class="card"><div class="tag">عندك كود استرجاع؟</div><input id="rcin" class="inp" maxlength="12" placeholder="XXXXX-XXXXX" style="direction:ltr;margin-top:8px;text-transform:uppercase"><button class="btn t" style="width:100%;margin-top:8px" onclick="rcRestore()">استرجع تقدمي</button><div style="font-size:12px;margin-top:6px">الاسترجاع بيستبدل التقدم اللي على الجهاز ده.</div></div><div id="rmsg" class="sm" style="text-align:center;font-weight:900"></div><div class="sp"></div><button class="btn t" onclick="'+back+'">رجوع</button>';
}
function rcRestore(){
  var c=$('#rcin').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length!==10){rmsg('اكتب الكود كامل (10 حروف وأرقام)');return}
  rmsg('بندوّر...');
  FB.saveGet(c).then(function(r){
    if(!r){rmsg('الكود غلط أو مش موجود');return}
    var o;try{o=JSON.parse(r.d)}catch(e){rmsg('الكود تالف');return}
    if(!o||o.v!==1||!o.u){rmsg('الكود تالف');return}
    if(!confirm('هيستبدل تقدمك على الجهاز ده بالتقدم المحفوظ. تكمل؟'))return;
    var n=function(x){return Number(x)||0},iv=o.inv||{};
    S={coins:n(o.coins),max:Math.max(1,Math.min(20,n(o.max))),stars:o.stars&&typeof o.stars==='object'?o.stars:{},inv:{fifty:n(iv.fifty),time:n(iv.time),sc:n(iv.sc)},own:o.own&&o.own.ch&&o.own.col&&o.own.th?o.own:{ch:['blob'],col:['c0'],th:['t0']},eq:o.eq&&o.eq.ch?o.eq:{ch:'blob',col:'c0',th:'t0'},rw:n(o.rw),crowns:n(o.crowns),streak:n(o.streak),last:String(o.last||''),wk:o.wk&&typeof o.wk==='object'?{k:n(o.wk.k),p:n(o.wk.p)}:undefined,seen:Array.isArray(o.seen)?o.seen:[],mute:!!o.mute,claim:n(o.claim),grp:o.grp?String(o.grp).slice(0,40):undefined,nick:o.nick?String(o.nick).slice(0,14):undefined,stage:o.stage==='p'?'p':(o.stage==='m'?'m':undefined),grade:n(o.grade),uid:String(o.u).slice(0,40),rc:c,rcOk:1,rcAt:Date.now(),rcSeen:1,reg:1};
    save();applyTheme();CSAVE_AT=Date.now();
    if(!S.stage)stageScr();else if(!S.grade)gradeScr();else home();
  }).catch(function(){rmsg('مقدرناش نوصل للكود، جرّب تاني')});
}
var GD=null,GLAST=0;
function fillGroups(){
  var e=$('#gp');if(!e||!GD)return;
  if(!GD.groups.length){e.style.display='none';return}
  var sc={};GD.cur.forEach(function(x){sc[x.g]=x.p||0});
  var list=GD.groups.map(function(g){return{id:g.id,n:g.n,c:g.c,p:sc[g.id]||0}}).sort(function(a,b){return b.p-a.p});
  var h='<div class="tag">مجموعات الأسبوع (نقاط الحصة)</div><div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">'+list.map(function(g,i){var me=g.id===S.grp;return'<div class="row'+(me?' me':'')+'"><b style="min-width:24px">'+(i+1)+'</b><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:'+esc(g.c||'#6B4A3A')+'"></span><span class="sp">'+esc(g.n)+(me?' (مجموعتك)':'')+'</span><b>'+g.p+'</b></div>'}).join('')+'</div>';
  var pm=0;GD.prev.forEach(function(x){if((x.p||0)>pm)pm=x.p});
  if(pm>0){var w=GD.prev.filter(function(x){return x.p===pm}).map(function(x){return esc(x.n)});h+='<div class="card" style="background:#E3B03F;text-align:center;font-weight:900;margin-top:8px">مجموعة الأسبوع اللي فات: '+w.join(' و ')+' ('+pm+' نقطة)</div>'}
  h+='<button class="btn t" style="width:100%;margin-top:8px;font-size:14px;min-height:38px" onclick="groupScr()">'+(S.grp?'غيّر مجموعتي':'اختار مجموعتي')+'</button>';
  e.style.display='';e.innerHTML=h;
}
function refreshGroups(f){
  if(!window.FB||!FB.groupsGet)return;
  var now=Date.now();if(!f&&now-GLAST<180000)return;GLAST=now;
  FB.groupsGet(wkKey()).then(function(r){GD=r;fillGroups()}).catch(function(){});
}
function groupScr(){
  if(!GD||!GD.groups.length){home();return}
  app.innerHTML='<div class="hd"><h1>اختار مجموعتك</h1><div>نقاطها من الحصة بتتحسب لمجموعتك</div></div><div class="sp"></div>'+GD.groups.map(function(g){return'<button class="btn'+(g.id===S.grp?'':' t')+'" onclick="setGrp(\''+esc(g.id)+'\')">'+esc(g.n)+'</button>'}).join('')+'<button class="btn t" style="font-size:14px" onclick="setGrp(\'\')">من غير مجموعة</button><button class="btn t" style="font-size:14px" onclick="home()">رجوع</button>';
}
function setGrp(id){S.grp=id||undefined;save();home()}
var ST=null;
function num(n){return Number(n).toLocaleString('en')}
function statsHtml(r){
  function cell(l,n){return'<div style="text-align:center"><div class="big" style="font-size:26px">'+num(n)+'</div><div class="sm">'+l+'</div></div>'}
  return'<div class="tag g">اللعبة دلوقتي</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">'+cell('<span class="dot"></span>أونلاين دلوقتي',r.online)+cell('لعبوا النهاردة',r.today)+cell('إجمالي اللاعبين',r.total)+(r.visits!=null?cell('مرات الدخول',r.visits):'')+'</div>';
}
function fillStats(){var e=$('#st');if(!e||!ST)return;e.style.display='';e.innerHTML=statsHtml(ST)}
var MK=null,LASTR=0;
function fillMk(){var e=$('#mk');if(!e||!MK||wkPts()<=0)return;var i=lgIdx(wkPts());e.style.display='';e.innerHTML='<div class="row">'+lgIcon(i,36)+'<div class="sp"><div style="font-weight:900">ترتيبك: #'+MK.rank+' من '+MK.total+'</div><div class="sm">دوري '+LG[i].n+' • '+wkPts()+' نقطة</div></div><button class="btn t" style="font-size:13px;padding:4px 12px;min-height:34px" onclick="board()">الترتيب</button></div>'}
function refreshStats(f){
  if(!window.FB||!$('#st'))return;
  if(!f&&Date.now()-LASTR<20000)return;LASTR=Date.now();if(S.rm)roomSync();
  var p=cairo();
  FB.stats(Date.now()-((p.hour*60+p.minute)*60+p.second)*1000).then(function(r){ST=r;fillStats()}).catch(function(){});
  if(wkPts()>0)FB.rank(wkId(wkKey()),wkPts()).then(function(r){MK=r;fillMk()}).catch(function(){});
}
window.onFB=function(){
  var first=!S.reg;FB.ping(S.uid,first).catch(function(){});if(first){S.reg=1;save()}
  setInterval(function(){if(document.visibilityState==='visible')FB.beat(S.uid).catch(function(){})},60000);
  setInterval(function(){refreshStats(true);refreshGroups()},60000);refreshStats(true);refreshGroups(true);
};
load();applyTheme();DB=daily();!S.stage?stageScr():(!S.grade?gradeScr():home());if(RQ&&S.stage&&S.grade&&!S.rm)roomScr(RQ.toUpperCase());
</script>
</body>
</html>
