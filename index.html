<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحدّي الأصحاب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Lemonada:wght@600;700&display=swap">
<style>
:root{--paper:#FBE7B5;--card:#FFE8B5;--ink:#4A2F22;--teal:#2F5F5A;--brown:#6B4A3A;--gold:#C9973F;--red:#7A3B3B;--ok:#2F6B4A;--bad:#8B2E2E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%}
body{background:#2B1B12;font-family:'Cairo',sans-serif;color:var(--ink)}
#app{max-width:430px;min-height:100%;margin:0 auto;box-sizing:border-box;background:var(--paper) repeating-linear-gradient(0deg,transparent 0 31px,rgba(150,110,50,.13) 31px 32px);padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.hd{background:var(--teal);border:2px solid var(--gold);border-radius:16px;color:#FFE9B8;text-align:center;padding:14px}
.hd h1{font-family:'Lemonada',sans-serif;font-size:24px;margin:0}
.hd div{font-size:13px;margin-top:6px}
.card{background:var(--card);border:2px solid #8A6A4A;border-radius:14px;padding:12px}
.tag{background:var(--brown);color:#FFE9B8;border-radius:8px;padding:5px;text-align:center;font-weight:700;font-size:14px}
.tag.g{background:var(--teal)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.sm{font-size:12px;color:var(--teal);font-weight:700}
.btn{background:var(--red);color:#FFE9B8;border:3px solid #D9A84E;border-radius:14px;box-shadow:0 5px 0 #4B2222;font-family:'Lemonada',sans-serif;font-size:18px;padding:12px;min-height:48px;cursor:pointer}
.btn.t{background:var(--teal);box-shadow:0 5px 0 #1B3B38}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4B2222}
.sw{width:52px;height:30px;border-radius:15px;border:2px solid var(--gold);background:#9A8566;position:relative;cursor:pointer;padding:0}
.sw i{position:absolute;top:2px;right:3px;width:22px;height:22px;border-radius:50%;background:#FFE9B8}
.sw.on{background:var(--ok)}
.sw:not(.on) i{right:25px}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--gold);border-radius:20px;padding:4px 12px;font-weight:900}
.bar{flex:1;height:14px;border-radius:7px;background:#E3C98F;border:2px solid #8A6A4A;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--gold)}
.bar.m i{background:#B23A3A}
.tm{background:var(--brown);color:#FFE9B8;border-radius:8px;min-width:38px;text-align:center;font-weight:900;padding:4px}
.en{direction:ltr;text-align:left;font-size:22px;font-weight:700;line-height:1.4;margin:8px 0}
.ar{border-top:2px dashed #8A6A4A;padding-top:8px;font-size:16px;font-weight:700}
.opt{background:var(--card);border:2px solid #8A6A4A;border-radius:14px;box-shadow:0 3px 0 #8A6A4A;min-height:48px;font-family:'Cairo',sans-serif;font-size:19px;font-weight:700;color:var(--ink);direction:ltr;cursor:pointer;padding:8px 14px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--gold)}
.opt.bad{background:var(--bad);color:#fff}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{background:var(--card);border:2px solid #8A6A4A;border-radius:12px;box-shadow:0 3px 0 #8A6A4A;padding:6px 2px;min-height:76px;font-family:'Cairo',sans-serif;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.lv b{font-size:22px}
.lv span{font-size:11px;font-weight:700}
.lv.boss{background:var(--red);color:#FFE9B8;border-color:var(--gold)}
.lv:disabled{opacity:.5;cursor:default}
.big{font-size:38px;font-weight:900;text-align:center}
.inp{font-family:'Cairo',sans-serif;font-size:20px;font-weight:700;padding:10px;border:2px solid #8A6A4A;border-radius:12px;background:#FFF6DD;color:var(--ink);text-align:center;width:100%;box-sizing:border-box}
.me{background:var(--teal);color:#FFE9B8;border-radius:8px;padding:4px 8px}
#mon.hit{animation:hit .5s}
#mon.atk{animation:atk .5s}
@keyframes hit{0%{transform:none;filter:brightness(1)}25%{transform:translateX(-12px) rotate(-8deg);filter:brightness(2)}50%{transform:translateX(12px) rotate(8deg)}100%{transform:none;filter:brightness(1)}}
@keyframes atk{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.gold{background:#E3B03F;border-radius:8px;padding:4px 8px}
.pwb{flex:1;background:var(--card);border:2px solid #8A6A4A;border-radius:12px;font-family:'Cairo',sans-serif;font-weight:700;font-size:13px;color:var(--ink);padding:6px 4px;min-height:44px;cursor:pointer;text-align:center}
.pwb:disabled{opacity:.45;cursor:default}
</style>
<script>
/* بعد ما تفعّل Firebase: امسح null والصق الإعدادات هنا، شكلها:
   window.FIREBASE_CONFIG = {apiKey:"...",authDomain:"...",projectId:"...",appId:"..."}; */
window.FIREBASE_CONFIG = null;
</script>
<script src="questions.js"></script>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,setDoc,collection,query,orderBy,limit,getDocs,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
if(window.FIREBASE_CONFIG){
  const db=getFirestore(initializeApp(window.FIREBASE_CONFIG));
  window.FB={
    submit:(wk,uid,name,pts)=>setDoc(doc(db,'weeks',String(wk),'scores',uid),{name:name,pts:pts,t:serverTimestamp()}),
    top:async(wk,n)=>{const s=await getDocs(query(collection(db,'weeks',String(wk),'scores'),orderBy('pts','desc'),limit(n||10)));return s.docs.map(d=>Object.assign({id:d.id},d.data()))}
  };
}
</script>
<script>
var TT={v:"اختار الكلمة الصح",g:"اكمل الجملة",w:"أي جملة غلط؟"};
var tr=true,G=null,S={},DB=0,app=document.getElementById('app');
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(a){return a.map(function(x){return[Math.random(),x]}).sort(function(a,b){return a[0]-b[0]}).map(function(x){return x[1]})}
function load(){try{S=JSON.parse(localStorage.getItem('qd_v2'))||{}}catch(e){S={}}S.coins=S.coins||0;S.max=S.max||1;S.stars=S.stars||{};S.streak=S.streak||0;S.last=S.last||'';S.seen=S.seen||[];S.inv=S.inv||{fifty:0,time:0,sc:0};S.own=S.own||{ch:['blob'],col:['c0'],th:['t0']};S.eq=S.eq||{ch:'blob',col:'c0',th:'t0'};S.uid=S.uid||(Math.random().toString(36).slice(2)+Date.now().toString(36))}
function save(){try{localStorage.setItem('qd_v2',JSON.stringify(S))}catch(e){}}
function daily(){var t=new Date().toDateString();if(S.last===t)return 0;var y=new Date(Date.now()-864e5).toDateString();S.streak=(S.last===y)?S.streak+1:1;S.last=t;var b=10+5*Math.min(S.streak,5);S.coins+=b;save();return b}
function wkKey(){return Math.floor((Math.floor(Date.now()/864e5)-2)/7)}
function wkPts(){return(S.wk&&S.wk.k===wkKey())?S.wk.p:0}
function addPts(n){var k=wkKey();if(!S.wk||S.wk.k!==k)S.wk={k:k,p:0};S.wk.p+=n;save()}
function submit(){if(window.FB&&S.nick){try{FB.submit(wkKey(),S.uid,S.nick,wkPts()).catch(function(){})}catch(e){}}}
function heart(o){return'<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.5-8 11-8 11z" fill="'+(o?'#B23A3A':'#CDB88A')+'" stroke="#6B4A3A" stroke-width="1.5"/></svg>'}
function star(o,s){s=s||16;return'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.5 5.7 21l1.5-7L2 9.3l7-.8z" fill="'+(o?'#C9973F':'#E3C98F')+'" stroke="#6B4A3A" stroke-width="1.2"/></svg>'}
function coin(){return'<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#E3B03F" stroke="#8A6A4A" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="#8A6A4A" stroke-width="1.5"/></svg>'}
function stars(n,s){var r='';for(var i=1;i<=3;i++)r+=star(i<=n,s);return r}
function monster(lv){var b=lv%5===0;return'<svg viewBox="0 0 120 110" width="'+(b?110:94)+'" aria-hidden="true">'+(b?'<path d="M28 34L34 8L50 30zM92 34L86 8L70 30z" fill="#6B4A3A" stroke="#4A2F22" stroke-width="2"/>':'')+'<path d="M15 98C5 58 30 24 60 24S115 58 105 98Z" fill="#7B9E6B" stroke="#4A2F22" stroke-width="3"/><circle cx="45" cy="60" r="11" fill="#fff" stroke="#4A2F22" stroke-width="2"/><circle cx="75" cy="60" r="11" fill="#fff" stroke="#4A2F22" stroke-width="2"/><circle cx="47" cy="62" r="5" fill="#4A2F22"/><circle cx="73" cy="62" r="5" fill="#4A2F22"/><path d="M40 82Q60 98 80 82" fill="none" stroke="#4A2F22" stroke-width="3"/></svg>'}
function home(){
  app.innerHTML='<div class="hd"><h1>تحدّي الأصحاب</h1><div>اهزم الوحش بالإنجليزي!</div></div>'+
  '<div class="row"><div class="chip">'+coin()+'<span>'+S.coins+'</span></div><div class="sp"></div><div class="sm">وصلت للجولة '+S.max+'</div></div>'+
  (DB?'<div class="card" style="text-align:center;font-weight:900">مكافأة اليوم: +'+DB+' عملة (أيام ورا بعض: '+S.streak+')</div>':'')+
  '<div class="card row"><div class="sp"><div style="font-weight:900">الترجمة بالعربي</div><div class="sm">تظهر تحت كل سؤال</div></div><button class="sw'+(tr?' on':'')+'" aria-label="الترجمة" onclick="tr=!tr;home()"><i></i></button></div>'+
  '<div class="card"><div class="tag">إزاي تلعب</div><div style="font-size:14px;margin-top:8px;line-height:1.7">جاوب صح علشان تضرب الوحش. الإجابة الغلط أو خلاص الوقت بيخسّرك قلب. 3 إجابات صح ورا بعض = ضربة قوية!</div></div>'+
  '<div class="sp"></div><button class="btn" style="font-size:20px" onclick="map()">ابدأ اللعب</button><button class="btn t" onclick="board()">ترتيب الأسبوع</button><button class="btn t" style="display:flex;justify-content:center;align-items:center;gap:10px" onclick="store()">'+shopIcon(30)+'<span>المتجر</span></button>';
}
function map(){
  var g='';for(var i=1;i<=10;i++){var u=i<=S.max,b=i%5===0;
    g+='<button class="lv'+(b?' boss':'')+'" '+(u?'onclick="start('+i+')"':'disabled')+'><b>'+i+'</b><span>'+(b?'زعيم':'جولة')+'</span><div>'+(u?stars(S.stars[i]||0,12):'<span>مقفولة</span>')+'</div></button>'}
  app.innerHTML='<div class="hd"><h1>خريطة الجولات</h1><div>اهزم وحش كل جولة علشان تفتح اللي بعدها</div></div>'+
  '<div class="row"><div class="chip">'+coin()+'<span>'+S.coins+'</span></div></div><div class="grid">'+g+'</div><div class="sp"></div><button class="btn t" onclick="home()">الرئيسية</button>';
}
function pickQs(n){
  var all=Q.map(function(_,i){return i}),out=shuffle(all.filter(function(i){return S.seen.indexOf(i)<0})).slice(0,n);
  if(out.length<n){S.seen=[];out=out.concat(shuffle(all.filter(function(i){return out.indexOf(i)<0})).slice(0,n-out.length))}
  S.seen=S.seen.concat(out);save();return out.map(function(i){return Q[i]});
}
function start(lv){var b=lv%5===0,n=b?7:5,T=Math.max(8,13-Math.ceil(lv/2))-(b?2:0),mx=Math.ceil(n*0.6);
  G={lv:lv,n:n,T:T,qs:pickQs(n),i:0,h:3,mx:mx,mhp:mx,earned:0,combo:0,ok:0,bad:[],left:T,done:false};show()}
function hearts(){var r='';for(var i=1;i<=3;i++)r+=heart(i<=G.h);return r}
function show(){
  var q=G.qs[G.i];G.left=G.T;G.done=false;G.f50=false;
  var o=q[2].map(function(t,k){return'<button class="opt" onclick="pick('+k+')">'+t+'</button>'}).join('');
  app.innerHTML='<div class="row"><div id="hr" class="row" style="gap:2px">'+hearts()+'</div><div class="sp"></div><div class="chip">'+coin()+'<span id="cn">'+S.coins+'</span></div></div>'+
  '<div class="card" style="padding:8px"><div class="row"><span class="sm">الوحش</span><div class="bar m"><i id="mh" style="width:'+(G.mhp/G.mx*100)+'%"></i></div></div>'+
  '<div id="mon" style="text-align:center;filter:hue-rotate('+hueOf()+'deg)"><div id="ms" style="display:inline-block;transform:scale(.85)">'+monster(G.lv,S.eq.ch)+'</div></div></div>'+
  '<div class="row"><span class="sm">جولة '+G.lv+(G.lv%5===0?' (زعيم)':'')+' • سؤال '+(G.i+1)+' من '+G.n+'</span><div class="bar"><i id="bf"></i></div><div class="tm" id="tm">'+G.T+'</div></div>'+
  '<div class="row" id="pw">'+pwHtml()+'</div>'+'<div class="card"><div class="tag g">'+TT[q[5]]+'</div><div class="en">'+q[0]+'</div>'+(tr?'<div class="ar"><div class="sm">الترجمة</div>'+q[1]+'</div>':'')+'</div>'+o+'<div id="fb"></div>';
  clearInterval(G.t);
  G.t=setInterval(function(){G.left-=0.1;if(G.left<=0){pick(-1);return}$('#bf').style.width=Math.min(100,G.left/G.T*100)+'%';$('#tm').textContent=Math.ceil(G.left);$('#ms').style.transform='scale('+(0.85+Math.max(0,1-G.left/G.T)*0.4)+')'},100);
}
function anim(c){var m=$('#mon');m.className='';void m.offsetWidth;m.className=c}
function pick(k){
  if(G.done)return;G.done=true;clearInterval(G.t);
  var q=G.qs[G.i],good=k===q[3],msg;
  if(good){var gain=5+Math.floor(G.left/3),dmg=1;G.combo++;G.ok++;msg='إجابة صح! +'+gain+' عملة';if(G.combo%3===0){gain+=10;dmg=2;msg+=' • كومبو! ضربة قوية'}G.mhp=Math.max(0,G.mhp-dmg);S.coins+=gain;G.earned+=gain;addPts(gain);anim('hit')}
  else{G.h--;G.combo=0;G.bad.push(q);msg=(k<0?'الوقت خلص':'غلط')+'، الوحش هاجمك وخسرت قلب';anim('atk');if(G.h<=0&&S.inv.sc>0&&!G.sc){S.inv.sc--;G.sc=1;G.h=1;msg+=' • الفرصة التانية رجّعت لك قلب!'}}
  $('#cn').textContent=S.coins;$('#hr').innerHTML=hearts();updPw();$('#mh').style.width=(G.mhp/G.mx*100)+'%';save();
  document.querySelectorAll('.opt').forEach(function(b,j){b.disabled=true;if(j===q[3])b.classList.add('ok');else if(j===k)b.classList.add('bad')});
  var win=G.mhp<=0,last=win||G.h<=0||G.i>=G.n-1;
  if(win)msg+=' • الوحش اتهزم!';
  $('#fb').innerHTML='<div class="card"><div style="font-weight:900">'+msg+'</div><div class="sm">'+q[4]+'</div></div><button class="btn t" style="width:100%;margin-top:12px" onclick="'+(last?'endRound()':'next()')+'">'+(last?'شوف النتيجة':'التالي')+'</button>';
}
function next(){G.i++;show()}
function share(){var t='أنا جبت '+wkPts()+' نقطة الأسبوع ده في تحدّي الأصحاب! تقدر تكسرني؟ '+location.href.split('?')[0];window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}
function endRound(){
  var win=G.mhp<=0,lv=G.lv,bonus=0;
  if(win){bonus=20+10*G.h;S.coins+=bonus;addPts(bonus);S.stars[lv]=Math.max(S.stars[lv]||0,G.h);if(lv===S.max&&lv<10)S.max++;save()}
  submit();
  var rv=G.bad.length?'<div class="card" style="display:flex;flex-direction:column;gap:8px"><div class="tag">للمراجعة</div>'+G.bad.map(function(q){return'<div><b style="direction:ltr;display:block;text-align:left">'+q[0].replace('____',q[2][q[3]])+'</b><span class="sm">'+q[4]+'</span></div>'}).join('')+'</div>':'';
  app.innerHTML='<div class="hd"><h1>'+(win?(lv===10?'خلّصت كل الجولات!':'الوحش اتهزم!'):(G.h<=0?'القلوب خلصت':'الوحش هرب'))+'</h1><div>'+(win?'عدّيت الجولة '+lv:'جرّب الجولة تاني، هتهزمه!')+'</div></div>'+
  (win?'<div class="card" style="text-align:center">'+stars(G.h,36)+'</div>':'')+
  '<div class="card row" style="justify-content:space-around"><div style="text-align:center"><div class="sm">عملات الجولة</div><div class="big">+'+(G.earned+bonus)+'</div></div><div style="text-align:center"><div class="sm">رصيدك</div><div class="big">'+S.coins+'</div></div></div>'+rv+
  '<div class="sp"></div>'+(win&&lv<10?'<button class="btn" style="font-size:20px" onclick="start('+(lv+1)+')">الجولة التالية</button>':'')+
  '<button class="btn'+(win&&lv<10?' t':'')+'" onclick="start('+lv+')">العب الجولة تاني</button><div class="row"><button class="btn t sp" onclick="share()">تحدّى صاحبك</button><button class="btn t sp" onclick="board()">الترتيب</button></div><button class="btn t" onclick="map()">الخريطة</button>';
}
function nick(){
  app.innerHTML='<div class="hd"><h1>اختار اسمك المستعار</h1><div>هيظهر في الترتيب. ماتكتبش اسمك الحقيقي</div></div><div class="card"><input id="nk" class="inp" maxlength="14" placeholder="مثلًا: نمر الإعدادي" value="'+esc(S.nick||'')+'"></div><div class="sp"></div><button class="btn" onclick="saveNick()">حفظ</button><button class="btn t" onclick="home()">رجوع</button>';
}
function saveNick(){var v=$('#nk').value.trim().slice(0,14);if(!v)return;S.nick=v;save();board()}
function leftTxt(){var k=wkKey(),ms=(7*(k+1)+2)*864e5-Date.now(),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);return'باقي '+d+' يوم و '+h+' ساعة على التصفير'}
var PR=[200,100,50];
function rows(r){return r.map(function(x,i){return'<div class="row'+(x.id===S.uid?' me':(i===0?' gold':''))+'"><b>'+(i+1)+'</b><span class="sp">'+esc(x.name)+'</span><b>'+x.pts+'</b></div>'}).join('')}
function board(){
  if(!S.nick){nick();return}
  app.innerHTML='<div class="hd"><h1>ترتيب الأسبوع</h1><div>'+leftTxt()+'</div></div>'+
  '<div class="card"><div class="tag">جايزة بطل الأسبوع</div><div style="font-size:14px;margin-top:8px;line-height:1.7">الأول: 200 عملة + لقب بطل الأسبوع • التاني: 100 • التالت: 50<br>بتوصلك لما تفتح الشاشة دي بعد التصفير.</div></div>'+
  '<div class="card row"><div class="sp"><div class="sm">اسمك: '+esc(S.nick)+(S.crowns?' • ألقاب: '+S.crowns:'')+'</div><div style="font-weight:900">نقاطك: '+wkPts()+' • <span id="rk">ترتيبك: ...</span></div></div><button class="btn t" style="font-size:14px;padding:6px 12px;min-height:36px" onclick="nick()">غيّر الاسم</button></div>'+
  '<div class="card" id="lb" style="display:flex;flex-direction:column;gap:8px">بنحمّل...</div>'+
  '<div class="card" id="pv" style="display:flex;flex-direction:column;gap:8px"></div>'+
  '<div class="sp"></div><button class="btn" onclick="share()">تحدّى صاحبك</button><button class="btn t" onclick="home()">الرئيسية</button>';
  var lb=$('#lb'),pv=$('#pv');
  if(!window.FB){lb.textContent='الترتيب لسه متفعّلش.';pv.style.display='none';return}
  var p=wkPts()>0?FB.submit(wkKey(),S.uid,S.nick,wkPts()).catch(function(){}):Promise.resolve();
  p.then(function(){return FB.top(wkKey(),10)}).then(function(r){
    lb.innerHTML=r.length?rows(r):'مفيش حد لسه. كن أول واحد!';
    var i=r.map(function(x){return x.id}).indexOf(S.uid);$('#rk').textContent='ترتيبك: '+(i>=0?(i+1):'برّه أول 10');
  }).catch(function(){lb.textContent='مقدرناش نحمّل الترتيب، جرّب تاني.'});
  FB.top(wkKey()-1,3).then(function(r){
    var h='<div class="tag">أبطال الأسبوع اللي فات</div>'+(r.length?rows(r):'مفيش نتايج لسه');
    var i=r.map(function(x){return x.id}).indexOf(S.uid);
    if(i>=0&&S.claim!==wkKey()-1){S.claim=wkKey()-1;S.coins+=PR[i];if(i===0)S.crowns=(S.crowns||0)+1;save();h+='<div class="card" style="text-align:center;font-weight:900;background:#E3B03F">مبروك! كسبت '+PR[i]+' عملة'+(i===0?' ولقب بطل الأسبوع':'')+'</div>'}
    pv.innerHTML=h;
  }).catch(function(){pv.style.display='none'});
}
var TAB='pw';
var TABS=[['pw','المساعدات'],['ch','الشخصيات'],['col','الألوان'],['th','الخلفيات']];
var ITEMS=[
{id:'fifty',k:'pw',n:'حذف إجابتين',d:'بيشيل إجابتين غلط من السؤال الحالي',p:400},
{id:'time',k:'pw',n:'+5 ثواني',d:'بيزوّد 5 ثواني للسؤال الحالي',p:350},
{id:'sc',k:'pw',n:'الفرصة التانية',d:'لما قلوبك تخلص بيرجّع لك قلب مرة في الجولة',p:600},
{id:'ghost',k:'ch',n:'الشبح',p:300},{id:'robot',k:'ch',n:'الروبوت',p:300},
{id:'c1',k:'col',n:'أزرق',h:120,p:200},{id:'c2',k:'col',n:'بنفسجي',h:180,p:200},{id:'c3',k:'col',n:'أحمر',h:260,p:200},{id:'c4',k:'col',n:'برتقالي',h:310,p:200},
{id:'t1',k:'th',n:'نعناع',c:'#CFE3D4',p:250},{id:'t2',k:'th',n:'لافندر',c:'#DAD3F2',p:250},{id:'t3',k:'th',n:'وردي',c:'#F6CFC6',p:250}
];
var DEF={ch:[{k:'ch',id:'blob',n:'الوحش الأخضر'}],col:[{k:'col',id:'c0',n:'حسب الجولة',h:0}],th:[{k:'th',id:'t0',n:'ورق كلاسيك',c:'#FBE7B5'}]};
function item(id){return ITEMS.filter(function(x){return x.id===id})[0]}
function monster(lv,ch,w){
  var b=lv%5===0,body,m='<path d="M40 82Q60 98 80 82" fill="none" stroke="#4A2F22" stroke-width="3"/>';
  if(ch==='ghost')body='<path d="M20 98V52C20 32 40 22 60 22S100 32 100 52V98L88 88L74 98L60 88L46 98L32 88Z" fill="#B9A7E0" stroke="#4A2F22" stroke-width="3"/>';
  else if(ch==='robot'){body='<rect x="22" y="34" width="76" height="64" rx="12" fill="#7FA3B5" stroke="#4A2F22" stroke-width="3"/><path d="M60 34V20" stroke="#4A2F22" stroke-width="3"/><circle cx="60" cy="16" r="6" fill="#C9973F" stroke="#4A2F22" stroke-width="2"/>';m='<path d="M44 84H76" stroke="#4A2F22" stroke-width="4"/>'}
  else body='<path d="M15 98C5 58 30 24 60 24S115 58 105 98Z" fill="#7B9E6B" stroke="#4A2F22" stroke-width="3"/>';
  return'<svg viewBox="0 0 120 110" width="'+(w||(b?110:94))+'" aria-hidden="true">'+(b?'<path d="M28 34L34 8L50 30zM92 34L86 8L70 30z" fill="#6B4A3A" stroke="#4A2F22" stroke-width="2"/>':'')+body+'<circle cx="45" cy="60" r="11" fill="#fff" stroke="#4A2F22" stroke-width="2"/><circle cx="75" cy="60" r="11" fill="#fff" stroke="#4A2F22" stroke-width="2"/><circle cx="47" cy="62" r="5" fill="#4A2F22"/><circle cx="73" cy="62" r="5" fill="#4A2F22"/>'+m+'</svg>';
}
function shopIcon(s){
  var st='',sc='',i,f;
  for(i=0;i<5;i++){f=(i%2?'#FFE9B8':'#7A3B3B');
    st+='<path d="M'+(10+8.8*i)+' 11L'+(6+10.4*i)+' 26H'+(6+10.4*(i+1))+'L'+(10+8.8*(i+1))+' 11Z" fill="'+f+'"/>';
    sc+='<circle cx="'+(11.2+10.4*i)+'" cy="26" r="5.2" fill="'+f+'"/>';}
  return'<svg width="'+s+'" height="'+s+'" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="5" width="48" height="6" rx="3" fill="#4A2F22"/>'+st+sc+'<rect x="10" y="32" width="44" height="26" rx="2" fill="#FFE8B5" stroke="#4A2F22" stroke-width="2.5"/><rect x="25" y="38" width="12" height="20" fill="#6B4A3A" stroke="#4A2F22" stroke-width="2"/><rect x="13" y="38" width="9" height="9" fill="#2F5F5A" stroke="#4A2F22" stroke-width="1.5"/><circle cx="46" cy="42" r="5" fill="#E3B03F" stroke="#8A6A4A" stroke-width="2"/></svg>';
}
function applyTheme(){var it=item(S.eq.th);document.documentElement.style.setProperty('--paper',it?it.c:'#FBE7B5')}
function hueOf(){var c=S.eq.col;if(c==='c0')return G?G.lv*40:0;var it=item(c);return it?it.h:0}
function pwHtml(){
  var no=G.done;
  return'<button class="pwb" onclick="useFifty()" '+((S.inv.fifty<1||G.f50||no)?'disabled':'')+'>حذف إجابتين ×'+S.inv.fifty+'</button><button class="pwb" onclick="useTime()" '+((S.inv.time<1||no)?'disabled':'')+'>+5 ثواني ×'+S.inv.time+'</button><div class="pwb" style="display:flex;align-items:center;justify-content:center;opacity:'+(S.inv.sc?1:.45)+'">فرصة تانية ×'+S.inv.sc+'</div>';
}
function updPw(){var e=$('#pw');if(e)e.innerHTML=pwHtml()}
function useFifty(){
  if(G.done||G.f50||S.inv.fifty<1)return;
  var q=G.qs[G.i],w=[];q[2].forEach(function(_,j){if(j!==q[3])w.push(j)});
  shuffle(w).slice(0,2).forEach(function(j){var b=document.querySelectorAll('.opt')[j];b.disabled=true;b.style.opacity='.3'});
  G.f50=true;S.inv.fifty--;save();updPw();
}
function useTime(){if(G.done||S.inv.time<1)return;G.left+=5;S.inv.time--;save();updPw()}
function prev(it){
  if(it.k==='ch')return monster(1,it.id,52);
  if(it.k==='col')return'<div style="width:40px;height:40px;border-radius:50%;background:'+(it.id==='c0'?'conic-gradient(#7B9E6B,#C9973F,#7B9E6B)':'#7B9E6B')+';filter:hue-rotate('+(it.h||0)+'deg);border:2px solid #4A2F22"></div>';
  if(it.k==='th')return'<div style="width:40px;height:40px;border-radius:8px;background:'+it.c+';border:2px solid #4A2F22"></div>';
  return'<div style="width:44px;height:44px;border-radius:10px;background:#2F5F5A;border:2px solid #C9973F;color:#FFE9B8;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center">'+(it.id==='fifty'?'−2':it.id==='time'?'+5':heart(true))+'</div>';
}
function store(t,m){
  if(t)TAB=t;
  var list=(TAB==='pw'?[]:DEF[TAB]).concat(ITEMS.filter(function(x){return x.k===TAB}));
  var small='font-size:14px;padding:6px 12px;min-height:40px';
  var cards=list.map(function(it){
    var btn;
    if(it.k==='pw'||(S.own[it.k].indexOf(it.id)<0))btn='<button class="btn" style="'+small+'" onclick="ask(\''+it.id+'\')">'+it.p+' عملة</button>';
    else btn=S.eq[it.k]===it.id?'<span class="sm">مستخدم</span>':'<button class="btn t" style="'+small+'" onclick="eq(\''+it.k+'\',\''+it.id+'\')">استخدم</button>';
    return'<div class="card row"><div style="width:56px;display:flex;justify-content:center">'+prev(it)+'</div><div class="sp"><div style="font-weight:900">'+it.n+(it.k==='pw'?' (عندك '+S.inv[it.id]+')':'')+'</div>'+(it.d?'<div class="sm">'+it.d+'</div>':'')+'</div>'+btn+'</div>';
  }).join('');
  var tabs=TABS.map(function(x){return'<button class="pwb" style="'+(x[0]===TAB?'background:#2F5F5A;color:#FFE9B8':'')+'" onclick="store(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');
  app.innerHTML='<div class="hd"><div style="display:flex;justify-content:center">'+shopIcon(54)+'</div><h1>المتجر</h1><div>اصرف عملاتك بحكمة</div></div>'+
  '<div class="row"><div class="chip">'+coin()+'<span>'+S.coins+'</span></div><div class="chip"><span class="sm">نقاط الأسبوع:</span><span>'+wkPts()+'</span></div></div>'+
  '<div class="card" style="background:#E3B03F"><div class="tag">تنبيه قبل ما تصرف</div><div style="font-size:14px;margin-top:8px;line-height:1.8">• أي حاجة تشتريها بتتخصم من عملاتك، وكمان من نقاطك في ترتيب الأسبوع. لو صرفت كل عملاتك ممكن تنزل في الترتيب.<br>• المساعدات غالية وبتخلص بعد الاستخدام، فاشتري لما تحتاج بس.<br>• في تحديثات جاية هتحتاج فيها عملات (حاجات جديدة وألعاب)، فخلّي باقي من رصيدك.</div></div>'+
  (m?'<div class="card" style="text-align:center;font-weight:900">'+m+'</div>':'')+
  '<div class="row">'+tabs+'</div>'+cards+'<div class="sp"></div><button class="btn t" onclick="home()">الرئيسية</button>';
}
function eq(k,id){S.eq[k]=id;save();applyTheme();store()}
function ask(id){
  var it=item(id),wp=wkPts(),af=Math.max(0,wp-it.p),ok=S.coins>=it.p;
  app.innerHTML='<div class="hd"><h1>تأكيد الشراء</h1><div>فكّر كويس قبل ما تأكّد</div></div>'+
  '<div class="card" style="text-align:center"><div style="font-weight:900;font-size:22px">'+it.n+'</div>'+(it.d?'<div class="sm">'+it.d+'</div>':'')+'</div>'+
  '<div class="card" style="background:#E3B03F;line-height:1.9;font-size:15px"><b>هتدفع:</b> '+it.p+' عملة (رصيدك هيبقى '+(S.coins-it.p)+')<br><b>ترتيبك الأسبوعي:</b> نقاطك هتنزل من '+wp+' إلى '+af+'<br>الشراء ده مش بيترجع.</div>'+
  (ok?'':'<div class="card" style="text-align:center;font-weight:900">رصيدك مش كفاية</div>')+
  '<div class="sp"></div>'+(ok?'<button class="btn" onclick="doBuy(\''+id+'\')">أكّد الشراء</button>':'')+'<button class="btn t" onclick="store()">رجوع</button>';
}
function doBuy(id){
  var it=item(id);if(!it||S.coins<it.p)return;
  S.coins-=it.p;var k=wkKey();if(!S.wk||S.wk.k!==k)S.wk={k:k,p:0};S.wk.p=Math.max(0,S.wk.p-it.p);
  if(it.k==='pw')S.inv[id]++;else{S.own[it.k].push(id);S.eq[it.k]=id;applyTheme()}
  save();submit();TAB=it.k;store(TAB,'اشتريت: '+it.n);
}

load();applyTheme();DB=daily();home();
</script>
</body>
</html>
